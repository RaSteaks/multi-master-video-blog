# One event-loop worker is sufficient on 1–2 core hosts.
worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    map $http_upgrade $blog_connection { default upgrade; '' close; }
    upstream blog_web { server web:3000; }
    upstream blog_api { server api:8060; }
    upstream blog_cms { server cms:8055; }
    server {
        listen 80;
        include /etc/nginx/blog/routes.conf;
    }
}
