# One event-loop worker is sufficient on 1–2 core hosts.
worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 512; }
http {
    # Bound anonymous analytics before forwarding or allocating an upstream connection.
    limit_req_zone $binary_remote_addr zone=blog_analytics:1m rate=30r/m;
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    # Reuse normal HTTP connections; retain WebSocket upgrade behavior.
    map $http_upgrade $blog_connection { default upgrade; '' ''; }
    upstream blog_web { server web:3000; keepalive 16; }
    upstream blog_api { server api:8060; keepalive 16; }
    upstream blog_cms { server cms:8055; keepalive 16; }
    server {
        listen 80;
        include /etc/nginx/blog/routes.conf;
    }
}
