# Anonymous beacon ingress budget (http context).
limit_req_zone $binary_remote_addr zone=blog_analytics:1m rate=30r/m;
# Install in nginx's http-context conf.d; install blog-routes.conf at the include path.
# Reuse normal HTTP connections; retain WebSocket upgrade behavior.
map $http_upgrade $blog_connection { default upgrade; '' ''; }
upstream blog_web { server 127.0.0.1:3000; keepalive 16; }
upstream blog_api { server 127.0.0.1:8060; keepalive 16; }
upstream blog_cms { server 127.0.0.1:8055; keepalive 16; }
server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name example.com;
    ssl_certificate /etc/video-blog/certs/fullchain.pem;
    ssl_certificate_key /etc/video-blog/certs/privkey.pem;
    include /etc/nginx/blog/routes.conf;
}
