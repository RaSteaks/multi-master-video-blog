# Example Nginx configuration for Windows deployments.
# Replace placeholders outside Git. Do not commit real domains, IPs, certificates, or keys.

server {
    listen 80;
    server_name example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.com;

    ssl_certificate C:/path/to/fullchain.pem;
    ssl_certificate_key C:/path/to/privkey.pem;

    client_max_body_size 4096m;

    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
        video/mp4 mp4;
        video/iso.segment m4s;
        application/json json;
        application/octet-stream sog ply;
        image/webp webp;
        image/avif avif;
        image/png png;
        image/jpeg jpg jpeg;
    }

    location = /manager {
        return 308 /manager/;
    }

    location /manager/ {
        # This panel can start and stop local services. Protect it in production
        # with basic auth, IP allowlists, VPN access, or another access control.
        # auth_basic "Service Manager";
        # auth_basic_user_file C:/path/to/.htpasswd;

        proxy_pass http://127.0.0.1:8070/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8055;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Directus Admin calls these API endpoints from the site root.
    # Keep /api/ reserved for the upload service below.
    location ~ ^/(server|auth|access|users|permissions|roles|policies|collections|fields|relations|items|files|folders|assets|utils|extensions|settings|flows|notifications|comments|activity|presets|dashboards|panels|webhooks|operations|revisions|versions|shares|translations|graphql|websocket)(/|$) {
        proxy_pass http://127.0.0.1:8055;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8060/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8055/assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/media/(.*\.m3u8)$ {
        alias D:/multi-master-video-blog/media/$1;
        autoindex off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Access-Control-Allow-Origin "*";
    }
    location /media/ {
        alias D:/multi-master-video-blog/media/;
        autoindex off;
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }
}
