# Example Nginx configuration for Windows deployments.
# Replace placeholders outside Git. Do not commit real domains, IPs, certificates, or keys.

server {
    listen 80;
    server_name example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.com;

    sendfile on;
    tcp_nopush on;
    etag on;
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        application/json
        application/javascript
        application/vnd.apple.mpegurl
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain;

    ssl_certificate C:/path/to/fullchain.pem;
    ssl_certificate_key C:/path/to/privkey.pem;

    client_max_body_size 4096m;

    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
        video/mp4 mp4;
        video/iso.segment m4s;
        application/json json;
        application/octet-stream sog ply;
        image/webp webp;
        image/avif avif;
        image/png png;
        image/jpeg jpg jpeg;
    }

    location = /manager {
        return 404;
    }

    location /manager/ {
        # Keep process control off the public site. Use a private authenticated
        # administration endpoint; Manager also requires its own configured password.
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8055;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Directus Admin calls these API endpoints from the site root.
    # Keep /api/ reserved for the upload service below.
    location ~ ^/(server|auth|access|users|permissions|roles|policies|collections|fields|relations|items|files|folders|assets|utils|extensions|settings|flows|notifications|comments|activity|presets|dashboards|panels|webhooks|operations|revisions|versions|shares|translations|graphql|websocket)(/|$) {
        proxy_pass http://127.0.0.1:8055;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8060/;
        proxy_http_version 1.1;
        # The Node service parses multipart uploads as a stream. Avoid writing
        # the complete multi-gigabyte request to Nginx temporary storage first.
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8055/assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        # Use the API's canonical-path/private-directory guard for every media
        # request, including playlists and Windows aliases. Do not restore a raw alias.
        proxy_pass http://127.0.0.1:8060;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        add_header Access-Control-Allow-Origin "*";
    }
}
