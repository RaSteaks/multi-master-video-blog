# Shared server-context routes for native and Docker deployments.
client_max_body_size 4096m;
sendfile on;
tcp_nopush on;
etag on;
open_file_cache max=256 inactive=60s;
gzip on;
gzip_comp_level 2;
gzip_min_length 1024;
gzip_vary on;
gzip_types application/json application/javascript application/vnd.apple.mpegurl text/css text/plain image/svg+xml;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $blog_connection;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

location = /healthz { access_log off; return 200 "ok\n"; }
location /manager { return 404; }
location / { proxy_pass http://blog_web; }
location /admin/ { proxy_pass http://blog_cms; }
location ~ ^/(server|auth|access|users|permissions|roles|policies|collections|fields|relations|items|files|folders|assets|utils|extensions|settings|flows|notifications|comments|activity|presets|dashboards|panels|webhooks|operations|revisions|versions|shares|translations|graphql|websocket)(/|$) {
    proxy_pass http://blog_cms;
    proxy_request_buffering off;
}
location /api/ {
    proxy_pass http://blog_api/;
    proxy_request_buffering off;
}
location /uploads/ { proxy_pass http://blog_cms/assets/; }
# Route all media through the canonical-path/private-file checks added upstream.
# A static alias would bypass the guard through symlinks or legacy private paths.
location /media/ {
    proxy_pass http://blog_api;
    proxy_buffering off;
    add_header Access-Control-Allow-Origin "*";
}
